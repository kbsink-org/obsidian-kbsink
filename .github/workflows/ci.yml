name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Verify wasm sources
        run: |
          test -f wasm/kbsink.wasm && test -f wasm/wasm_exec.js || {
            echo "CI requires wasm/kbsink.wasm and wasm/wasm_exec.js in the repo."
            exit 1
          }

      - run: npm ci
      - run: npm run build

      - name: List dist
        run: find dist -type f | sort
